# PROD topology (D-108): Postgres 18.6 + single app JAR.
# DEV remains compose.yaml (Postgres-only). No K8s / Redis-as-truth / multi-JAR split.
#
# Required host env (do not commit secrets):
#   NOMAD_JWT_SECRET — min 32 chars for HS256; inject via shell/CI secrets only.
#   NOMAD_POSTGRES_PASSWORD — Postgres password for PROD; never commit a real default.

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: nomad
      POSTGRES_USER: nomad
      POSTGRES_PASSWORD: ${NOMAD_POSTGRES_PASSWORD:?set NOMAD_POSTGRES_PASSWORD for PROD}
    volumes:
      - nomad-pg-prod:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomad -d nomad"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nomad
      SPRING_DATASOURCE_USERNAME: nomad
      SPRING_DATASOURCE_PASSWORD: ${NOMAD_POSTGRES_PASSWORD:?set NOMAD_POSTGRES_PASSWORD for PROD}
      NOMAD_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nomad
      NOMAD_DATASOURCE_USERNAME: nomad
      NOMAD_DATASOURCE_PASSWORD: ${NOMAD_POSTGRES_PASSWORD:?set NOMAD_POSTGRES_PASSWORD for PROD}
      # Secret value must come from the host environment — never hard-code here (T-07-28).
      NOMAD_JWT_SECRET: ${NOMAD_JWT_SECRET:?set NOMAD_JWT_SECRET for PROD}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  nomad-pg-prod:
